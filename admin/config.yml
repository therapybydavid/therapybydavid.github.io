backend:
  name: github
  repo: therapybydavid/therapybydavid.github.io
  branch: main
  auth_type: pkce
  app_id: Ov23liRBgMdAEJi8bBp3

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "blog/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "blog/post.html?post={{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Anxiety", "Trauma", "Depression", "Burnout", "Veterans", "Relationships", "General"]
      - label: "Short Description"
        name: "description"
        widget: "text"
        hint: "1-2 sentence summary shown on the blog listing page"
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "MMMM D, YYYY"
        time_format: false
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Optional. Upload a photo for this article."
      - label: "Content"
        name: "body"
        widget: "markdown"
