<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Archive — David Robles</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #0F172A;
      color: #E2E8F0;
      min-height: 100vh;
    }

    .header {
      background: #0F172A;
      border-bottom: 1px solid #1E3A5F;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 18px;
      font-weight: normal;
      color: #67C3D8;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }

    .header a {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #4A90A4;
      text-decoration: none;
      border: 1px solid #4A90A4;
      padding: 8px 16px;
      border-radius: 4px;
    }

    .header a:hover { background: #4A90A4; color: white; }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    /* Archive list view */
    #archive-view h2 {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #67C3D8;
      font-family: Arial, sans-serif;
      margin-bottom: 32px;
    }

    .newsletter-card {
      background: #1E293B;
      border: 1px solid #1E3A5F;
      border-radius: 8px;
      padding: 28px 32px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }

    .newsletter-card:hover {
      border-color: #4A90A4;
      transform: translateY(-1px);
    }

    .card-meta {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #67C3D8;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 22px;
      color: #F1F5F9;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-preview {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #94A3B8;
      line-height: 1.5;
    }

    .card-arrow {
      float: right;
      color: #4A90A4;
      font-size: 20px;
      margin-top: -36px;
    }

    /* Single newsletter view */
    #post-view { display: none; }

    .back-btn {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #67C3D8;
      cursor: pointer;
      margin-bottom: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .back-btn:hover { color: #4A90A4; }

    .post-issue {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #67C3D8;
      margin-bottom: 12px;
    }

    .post-title {
      font-size: 36px;
      color: #F1F5F9;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .post-date {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #64748B;
      margin-bottom: 48px;
      padding-bottom: 32px;
      border-bottom: 1px solid #1E3A5F;
    }

    /* Newsletter content styles */
    #post-content {
      font-size: 18px;
      line-height: 1.85;
      color: #CBD5E1;
    }

    #post-content p { margin-bottom: 20px; }

    #post-content h2 {
      font-size: 24px;
      color: #F1F5F9;
      margin: 48px 0 16px;
      border-left: 4px solid #4A90A4;
      padding-left: 16px;
    }

    #post-content h3 {
      font-size: 18px;
      color: #67C3D8;
      margin: 32px 0 12px;
      font-family: Arial, sans-serif;
    }

    #post-content strong { color: #F1F5F9; }

    #post-content a { color: #4A90A4; }

    #post-content blockquote {
      border-left: 3px solid #4A90A4;
      padding: 16px 24px;
      margin: 24px 0;
      background: #1E293B;
      border-radius: 0 6px 6px 0;
      color: #94A3B8;
      font-style: italic;
    }

    .edit-btn {
      display: inline-block;
      margin-top: 48px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      background: transparent;
      color: #4A90A4;
      border: 1px solid #4A90A4;
      padding: 10px 20px;
      border-radius: 4px;
      text-decoration: none;
    }

    .edit-btn:hover { background: #4A90A4; color: white; }

    .empty {
      text-align: center;
      padding: 80px 0;
      font-family: Arial, sans-serif;
      color: #64748B;
    }

    .loading {
      text-align: center;
      padding: 60px 0;
      font-family: Arial, sans-serif;
      color: #64748B;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📬 Newsletter Archive</h1>
    <a href="/admin/#/collections/newsletters/new">+ Write New Issue</a>
  </div>

  <div class="container">

    <!-- Archive List -->
    <div id="archive-view">
      <h2>All Issues</h2>
      <div id="newsletter-list"><div class="loading">Loading newsletters...</div></div>
    </div>

    <!-- Single Post -->
    <div id="post-view">
      <a class="back-btn" onclick="showArchive()">← Back to all issues</a>
      <div class="post-issue" id="post-issue"></div>
      <h1 class="post-title" id="post-title"></h1>
      <div class="post-date" id="post-date"></div>
      <div id="post-content"></div>
      <a class="edit-btn" id="edit-link" href="#">✏️ Edit this issue in CMS</a>
    </div>

  </div>

  <script>
    // Newsletter registry — add each new polished HTML issue here.
    // Newest first; the page sorts by `date` automatically.
    const newsletters = [
      {
        file:    'issue-1-understanding-anxiety.html',
        issue:   'Issue #1',
        title:   'Understanding Anxiety',
        preview: "A therapist's honest breakdown of what anxiety actually is — and how to work with your body to disarm it.",
        date:    '2026-05-24',
      },
    ];

    function init() {
      const list = document.getElementById('newsletter-list');
      if (newsletters.length === 0) {
        list.innerHTML = '<div class="empty">No newsletters yet.</div>';
        return;
      }

      const sorted = [...newsletters].sort((a, b) => new Date(b.date) - new Date(a.date));

      list.innerHTML = sorted.map(n => `
        <a class="newsletter-card" href="${n.file}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:inherit;">
          <div class="card-meta">${n.issue || ''} &nbsp;·&nbsp; ${formatDate(n.date)}</div>
          <div class="card-title">${n.title}</div>
          <div class="card-preview">${n.preview || ''}</div>
          <div class="card-arrow">→</div>
        </a>
      `).join('');
    }

    function formatDate(d) {
      if (!d) return '';
      return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    init();
  </script>

</body>
</html>
