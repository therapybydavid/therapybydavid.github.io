<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Visit Recorder</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Visit Rec">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/visit-recorder.webmanifest">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080b10;
      --surface: #0f1520;
      --card:    #141c2a;
      --card2:   #192030;
      --gold:    #b99138;
      --gold-lt: #c8a96e;
      --text:    #e8e0d4;
      --muted:   #7a7a8a;
      --dim:     #4a4a5a;
      --red:     #c0392b;
      --red-br:  #e74c3c;
      --green:   #27ae60;
      --border:  rgba(185,145,56,0.22);
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--gold); }
    #hdr-date  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    #sync-dot  {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--dim); flex-shrink: 0;
      transition: background 0.4s;
    }
    #sync-dot.synced  { background: var(--green); }
    #sync-dot.syncing { background: var(--gold); animation: pulse-dot 1s infinite; }
    #sync-dot.error   { background: var(--red-br); }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }

    .record-zone {
      padding: 20px 16px 0;
      max-width: 520px;
      margin: 0 auto;
    }

    #record-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; width: 100%; padding: 28px 20px;
      border: none; border-radius: 18px;
      font-size: 22px; font-weight: 800; letter-spacing: 0.4px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      user-select: none; transition: transform 0.1s;
    }
    #record-btn:active { transform: scale(0.97); }
    #record-btn.idle      { background: var(--red);   color: #fff; }
    #record-btn.recording {
      background: var(--red-br); color: #fff;
      animation: pulse-ring 1.8s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%,100% { box-shadow: 0 0 0 0   rgba(231,76,60,0.55); }
      50%     { box-shadow: 0 0 0 18px rgba(231,76,60,0); }
    }
    .dot { width: 16px; height: 16px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    #record-btn.recording .dot { animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.12} }

    #timer {
      text-align: center; font-size: 40px; font-weight: 200;
      font-variant-numeric: tabular-nums; color: var(--gold-lt);
      letter-spacing: 3px; min-height: 56px; line-height: 56px; margin: 12px 0 2px;
    }
    #status { text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; margin-bottom: 4px; }

    #recordings-list { max-width: 520px; margin: 0 auto; padding: 0 16px; }

    .rec-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; margin-top: 20px; overflow: hidden;
      animation: slide-in 0.28s ease;
    }
    @keyframes slide-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .rec-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 10px; border-bottom: 1px solid var(--border); gap: 8px;
    }
    .rec-num  { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--gold); white-space: nowrap; }
    .rec-time { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .rec-dur  { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--gold-lt); white-space: nowrap; }
    .rec-saved { font-size: 11px; color: var(--green); white-space: nowrap; opacity: 0; transition: opacity 0.4s; }
    .rec-saved.show { opacity: 1; }
    .rec-delete {
      background: none; border: none; color: var(--dim);
      font-size: 18px; cursor: pointer; padding: 2px 4px; line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }
    .rec-delete:active { color: var(--red-br); }

    .rec-who-wrap { padding: 10px 14px 0; }
    .rec-who-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin-bottom: 5px; }
    .rec-who-input {
      width: 100%; padding: 10px 12px; background: var(--card2);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 16px; outline: none;
      -webkit-appearance: none; font-family: inherit;
    }
    .rec-who-input::placeholder { color: var(--dim); }
    .rec-who-input:focus { border-color: var(--gold); }

    .rec-summary-wrap { padding: 10px 14px 14px; }
    .rec-summary-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin-bottom: 5px; }
    .rec-summary {
      width: 100%; min-height: 120px; padding: 10px 12px;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
      line-height: 1.65; resize: vertical; outline: none;
      font-family: inherit; -webkit-appearance: none;
    }
    .rec-summary::placeholder { color: var(--dim); }
    .rec-summary:focus { border-color: var(--gold); }
    .rec-summary.loading { color: var(--muted); font-style: italic; }

    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--green); color: #fff;
      padding: 11px 22px; border-radius: 100px;
      font-weight: 700; font-size: 14px; opacity: 0;
      transition: opacity 0.22s, transform 0.22s;
      pointer-events: none; white-space: nowrap; z-index: 1000;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🎙 Visit Recorder</h1>
    <div id="hdr-date"></div>
  </div>
  <div id="sync-dot" title="Firebase sync status"></div>
</header>

<div class="record-zone">
  <button id="record-btn" class="idle" onclick="toggleRecording()">
    <span class="dot"></span>
    <span id="btn-label">START RECORDING</span>
  </button>
  <div id="timer"></div>
  <div id="status"></div>
</div>

<div id="recordings-list"></div>
<div id="toast"></div>

<!-- ── Main UI script ── -->
<script>
var recordings      = [];
var recognition     = null;
var timerInterval   = null;
var elapsed         = 0;
var finalTranscript = '';
var isRecording     = false;
var hasSpeech       = false;
var recordStartTime = null;
var fbUpdateTimers  = {};

// Queue for records that arrive before Firebase is ready
window.fbPendingSaves = [];

/* ── Header date ── */
(function() {
  var opts = { weekday:'long', month:'long', day:'numeric' };
  document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('en-US', opts);
})();

/* ── Sync dot ── */
function setSyncDot(state) {
  document.getElementById('sync-dot').className = state;
}

/* ── Speech recognition (silent capture — no live display) ── */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  hasSpeech   = true;
  recognition = new SR();
  recognition.continuous     = true;
  recognition.interimResults = false; // no live text flying across screen
  recognition.lang           = 'en-US';
  recognition.onresult = function(e) {
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript + ' ';
    }
    var wordCount = finalTranscript.trim().split(/\s+/).filter(Boolean).length;
    if (wordCount > 0) setStatus('● Recording… (' + wordCount + ' words)');
  };
  recognition.onerror = function(e) {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
  };
  recognition.onend = function() {
    if (isRecording) { try { recognition.start(); } catch(e) {} }
  };
}

/* ── Helpers ── */
function fmt(s) {
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function fmtTime(d) {
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function setStatus(msg) { document.getElementById('status').textContent = msg; }
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2600);
}

/* ── Record / stop ── */
function toggleRecording() {
  if (!isRecording) startRecording(); else stopRecording();
}

function startRecording() {
  finalTranscript = '';

  // Explicitly request mic permission — required on iOS for speech capture
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    stream.getTracks().forEach(function(t) { t.stop(); }); // release immediately
    if (hasSpeech) { try { recognition.start(); } catch(e) {} }
  }).catch(function() {
    setStatus('Microphone access denied — tap the address bar to allow it');
    return;
  });

  isRecording     = true;
  recordStartTime = new Date();
  elapsed         = 0;
  document.getElementById('timer').textContent = '0:00';
  timerInterval   = setInterval(function() {
    elapsed++;
    document.getElementById('timer').textContent = fmt(elapsed);
  }, 1000);

  var btn = document.getElementById('record-btn');
  btn.className = 'recording';
  document.getElementById('btn-label').textContent = 'TAP TO STOP';
  setStatus('● Recording…');
}


function stopRecording() {
  isRecording = false;
  clearInterval(timerInterval);
  if (hasSpeech) { try { recognition.stop(); } catch(e) {} }

  var btn = document.getElementById('record-btn');
  btn.className = 'idle';
  document.getElementById('btn-label').textContent = 'START RECORDING';
  document.getElementById('timer').textContent = '';
  setStatus('Tap to record another visit');

  var rec = {
    id:         Date.now(),
    startTime:  recordStartTime,
    duration:   elapsed,
    transcript: finalTranscript.trim(),
    summary:    '',
    who:        ''
  };
  recordings.push(rec);
  renderCard(rec);
  // Summary generation saves to storage + Firebase when done
  generateSummary(rec);
}

/* ── AI summary ── */
async function generateSummary(rec) {
  var summaryEl = document.getElementById('summary-' + rec.id);
  if (!summaryEl) return;

  if (!rec.transcript || rec.transcript.length < 15) {
    summaryEl.readOnly = false;
    summaryEl.classList.remove('loading');
    summaryEl.value = '';
    rec.summary = '';
    saveToStorage();
    fbSaveOrQueue(rec);
    return;
  }

  try {
    var resp = await fetch('/functions/summarize-visit', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ transcript: rec.transcript })
    });
    if (!resp.ok) {
      var errText = await resp.text().catch(function(){ return resp.status; });
      throw new Error('HTTP ' + resp.status + ': ' + errText);
    }
    var data = await resp.json();
    rec.summary = data.summary || rec.transcript;
  } catch(e) {
    rec.summary = '[Summary error: ' + e.message + ']\n\n' + rec.transcript;
  }

  summaryEl.readOnly = false;
  summaryEl.classList.remove('loading');
  summaryEl.value = rec.summary;
  saveToStorage();
  fbSaveOrQueue(rec);
}

function fbSaveOrQueue(rec) {
  if (window.fbSave) {
    window.fbSave(rec);
  } else {
    window.fbPendingSaves.push(rec);
  }
}

/* ── Render card ── */
function renderCard(rec) {
  var list    = document.getElementById('recordings-list');
  var num     = recordings.length;
  var isNew   = !rec.restored;
  var display = rec.summary || rec.transcript || '';

  var card    = document.createElement('div');
  card.className = 'rec-card';
  card.id = 'card-' + rec.id;
  card.innerHTML =
    '<div class="rec-header">' +
      '<span class="rec-num">Visit ' + num + '</span>' +
      '<span class="rec-time">' + fmtTime(rec.startTime) + '</span>' +
      '<span class="rec-dur">' + fmt(rec.duration) + '</span>' +
      '<span class="rec-saved" id="saved-' + rec.id + '">✓ Saved</span>' +
      '<button class="rec-delete" onclick="deleteCard(' + rec.id + ')">✕</button>' +
    '</div>' +
    '<div class="rec-who-wrap">' +
      '<div class="rec-who-label">Who visited</div>' +
      '<input class="rec-who-input" type="text" placeholder="Dr. Smith, Nurse Maria…" autocomplete="off" autocorrect="off" oninput="updateRecField(' + rec.id + ',\'who\',this.value)">' +
    '</div>' +
    '<div class="rec-summary-wrap">' +
      '<div class="rec-summary-label">Summary</div>' +
      '<textarea class="rec-summary' + (isNew ? ' loading' : '') + '" id="summary-' + rec.id + '"' +
        (isNew ? ' readonly' : '') +
        ' placeholder="Add notes…" oninput="updateRecField(' + rec.id + ',\'summary\',this.value)"></textarea>' +
    '</div>';

  list.appendChild(card);

  if (rec.who) card.querySelector('.rec-who-input').value = rec.who;

  var summaryEl = document.getElementById('summary-' + rec.id);
  if (display) {
    summaryEl.value = display;
  } else if (isNew) {
    summaryEl.value = '● Summarizing…';
  }

  if (isNew) {
    setTimeout(function() { card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 100);
  }
}

function showSaved(id) {
  var el = document.getElementById('saved-' + id);
  if (!el) return;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2000);
}

/* ── Field updates (debounced to Firebase) ── */
function updateRecField(id, field, val) {
  var rec = recordings.find(function(r) { return r.id === id; });
  if (!rec) return;
  rec[field] = val;
  saveToStorage();
  clearTimeout(fbUpdateTimers[id + field]);
  fbUpdateTimers[id + field] = setTimeout(function() {
    if (window.fbUpdate) window.fbUpdate(id, field, val);
  }, 1000);
}

/* ── Delete ── */
function deleteCard(id) {
  if (!confirm('Remove this visit?')) return;
  recordings = recordings.filter(function(r) { return r.id !== id; });
  var card   = document.getElementById('card-' + id);
  if (card) card.remove();
  renumberCards();
  saveToStorage();
  if (window.fbDelete) window.fbDelete(id);
}

function renumberCards() {
  recordings.forEach(function(rec, i) {
    var card = document.getElementById('card-' + rec.id);
    if (card) { var n = card.querySelector('.rec-num'); if (n) n.textContent = 'Visit ' + (i + 1); }
  });
}

/* ── localStorage ── */
function saveToStorage() {
  try {
    var data = recordings.map(function(r) {
      return {
        id:         r.id,
        startTime:  r.startTime instanceof Date ? r.startTime.toISOString() : r.startTime,
        duration:   r.duration,
        transcript: r.transcript || '',
        summary:    r.summary    || '',
        who:        r.who        || ''
      };
    });
    localStorage.setItem('vr_recordings', JSON.stringify(data));
  } catch(e) {}
}

function loadFromStorage() {
  try {
    var raw = localStorage.getItem('vr_recordings');
    if (!raw) return;
    var data = JSON.parse(raw);
    if (!data || !data.length) return;
    data.forEach(function(d) {
      if (recordings.find(function(r) { return r.id === d.id; })) return;
      var rec = {
        id:         d.id,
        startTime:  new Date(d.startTime),
        duration:   d.duration,
        transcript: d.transcript || '',
        summary:    d.summary    || '',
        who:        d.who        || '',
        restored:   true
      };
      recordings.push(rec);
      renderCard(rec);
    });
  } catch(e) {}
}

window.addEventListener('load', function() {
  loadFromStorage();
});
</script>

<!-- ── Firebase module (auto-save + sync) ── -->
<script type="module">
import { initializeApp }                           from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInAnonymously }              from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, where, serverTimestamp }
                                                   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyARzjrwt_Asr-_ca5bBYUBoFUMKM8sRAFc",
  authDomain:        "therapy-by-david.firebaseapp.com",
  projectId:         "therapy-by-david",
  storageBucket:     "therapy-by-david.firebasestorage.app",
  messagingSenderId: "45351635355",
  appId:             "1:45351635355:web:3da34281325675f125793e"
};

const app     = initializeApp(firebaseConfig);
const auth    = getAuth(app);
const db      = getFirestore(app);
const fbIdMap = {};

setSyncDot('syncing');

try {
  const cred = await signInAnonymously(auth);
  const uid  = cred.user.uid;

  /* ── Load this device's recordings ── */
  const snap = await getDocs(query(
    collection(db, 'visit_recordings'),
    where('userId', '==', uid)
  ));
  const rows = [];
  snap.forEach(function(d) { rows.push({ fbId: d.id, ...d.data() }); });
  rows.sort(function(a, b) { return (a.startTime?.seconds || 0) - (b.startTime?.seconds || 0); });

  rows.forEach(function(d) {
    fbIdMap[d.localId] = d.fbId;
    if (window.recordings && window.recordings.find(function(r) { return r.id === d.localId; })) return;
    var rec = {
      id:         d.localId,
      startTime:  d.startTime?.toDate ? d.startTime.toDate() : new Date(d.startTime),
      duration:   d.duration,
      transcript: d.transcript || '',
      summary:    d.summary    || '',
      who:        d.who        || '',
      restored:   true
    };
    window.recordings.push(rec);
    window.renderCard(rec);
  });

  setSyncDot('synced');

  /* ── Save a new recording ── */
  window.fbSave = async function(rec) {
    setSyncDot('syncing');
    try {
      const ref = await addDoc(collection(db, 'visit_recordings'), {
        userId:     uid,
        localId:    rec.id,
        startTime:  rec.startTime,
        duration:   rec.duration,
        transcript: rec.transcript || '',
        summary:    rec.summary    || '',
        who:        rec.who        || '',
        createdAt:  serverTimestamp()
      });
      fbIdMap[rec.id] = ref.id;
      setSyncDot('synced');
      window.showSaved(rec.id);
    } catch(e) { setSyncDot('error'); }
  };

  /* ── Update a field ── */
  window.fbUpdate = async function(localId, field, val) {
    var fbId = fbIdMap[localId];
    if (!fbId) return;
    setSyncDot('syncing');
    try {
      var patch = {}; patch[field] = val;
      await updateDoc(doc(db, 'visit_recordings', fbId), patch);
      setSyncDot('synced');
      window.showSaved(localId);
    } catch(e) { setSyncDot('error'); }
  };

  /* ── Delete a recording ── */
  window.fbDelete = async function(localId) {
    var fbId = fbIdMap[localId];
    if (!fbId) return;
    try { await deleteDoc(doc(db, 'visit_recordings', fbId)); delete fbIdMap[localId]; } catch(e) {}
  };

  /* ── Drain any recordings that arrived before Firebase was ready ── */
  if (window.fbPendingSaves && window.fbPendingSaves.length) {
    window.fbPendingSaves.forEach(function(rec) { window.fbSave(rec); });
    window.fbPendingSaves = [];
  }

} catch(err) {
  setSyncDot('error');
  console.error('Firebase error:', err);
}
</script>

</body>
</html>
